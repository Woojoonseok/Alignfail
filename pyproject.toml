[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "frontend", "sample-data", "artifacts", ".studio"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "training"]
